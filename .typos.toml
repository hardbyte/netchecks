[default]
locale = "en-us"

[default.extend-words]
# Pydantic uses British spelling for this method name
customise = "customise"

[files]
ignore-vcs = true
extend-exclude = [
  ".git",
  "LICENSE",
  "*policyreports*.yaml",
  "clusterpolicyreports.yaml",
  # Generated by operator/create-static-manifests.sh; embeds upstream CRD
  # descriptions (same text as the excluded policyreports files).
  "operator/manifests/deploy.yaml"
]

