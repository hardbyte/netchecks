# Default values for netchecks operator

nameOverride: ""
fullnameOverride: ""

# Custom Resource Definitions installed by this chart.
#
# Deprecated: `installCRDs` is still honored as an alias for `crds.install`, but
# `crds` should be preferred.
crds:
  # If the CRDs are not installed by Helm, they must be added before installing
  # the operator.
  install: true

  # Annotate the CRDs with `helm.sh/resource-policy: keep` so that they survive
  # `helm uninstall`, along with any NetworkAssertion and PolicyReport resources
  # in the cluster. This matches the behavior of the chart's former `crds/`
  # directory, which Helm never removes.
  keep: true

  groups:
    # NetworkAssertion (`netchecks.io`), defined and owned by Netchecks.
    netchecks: true

    # PolicyReport and ClusterPolicyReport (`wgpolicyk8s.io`). This is a shared,
    # vendor-neutral API group that other components install as well, for example
    # Kyverno, the Trivy PolicyReport adapters or Kubescape. Set this to false
    # when another component owns these CRDs, so that two charts do not overwrite
    # each other's copy.
    #
    # The operator discovers which PolicyReport API version the cluster serves at
    # runtime (v1beta1, falling back to v1alpha2), so the commonly distributed
    # copies of these CRDs all work. See the chart README.
    wgpolicyk8s: true

networkPolicy:
  enabled: true

policy-reporter:
  enabled: false
  # enable policy-report-ui
  ui:
    enabled: false

operator:
  image:
    repository: ghcr.io/hardbyte/netchecks-operator
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""

  imagePullSecrets: []

  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: "netcheck-operator"

  podAnnotations: {}

  podSecurityContext: {}

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65534

  service:
    type: ClusterIP
    port: 8080

  resources: {}
    # Helm recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi


  nodeSelector: {}

  tolerations: []

  affinity: {}

probeConfig:

  image:
    repository: ghcr.io/hardbyte/netchecks
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""

  # Default resources for created probes
  resources: {}
#    limits:
#      cpu: "100m"
#      memory: "128Mi"
#    requests:
#      cpu: "20m"
#      memory: "64Mi"

  imagePullSecrets: []

#  serviceAccount:
#    # Specifies whether a service account should be created
#    create: true
#    # Annotations to add to the service account
#    annotations: {}
#    # The name of the service account to use.
#    # If not set and create is true, a name is generated using the fullname template
#    name: "netcheck-probe-account"

  podAnnotations: {}

  nodeSelector: {}

  tolerations: []

  affinity: {}
