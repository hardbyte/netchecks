metadata:
  name: netchecks-operator
  labels:
    app.kubernetes.io/name: netchecks
    app.kubernetes.io/instance: netchecks-operator
    app.kubernetes.io/version: "0.10.0"
spec:
  # Only one replica is required for the operator
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: netchecks
      app.kubernetes.io/instance: netchecks-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netchecks
        app.kubernetes.io/instance: netchecks-operator
    spec:
      serviceAccountName: netcheck-operator
      securityContext:
        {}
      containers:
        - name: netchecks
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
          image: "ghcr.io/hardbyte/netchecks-operator:main"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            {}
          env:
            - name: RUST_LOG
              value: "info,netchecks_operator=debug"
            - name: OPERATOR_HTTP_ADDR
              value: "0.0.0.0:8080"
            - name: PROBE_IMAGE_REPOSITORY
              value: "ghcr.io/hardbyte/netchecks"
            - name: PROBE_IMAGE_TAG
              value: "main"
            - name: PROBE_IMAGE_PULL_POLICY
              value: "IfNotPresent"
