name: Linting

on: [push]

jobs:
  check-linters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: reviewdog/action-shellcheck@v1
        with:
          filter_mode: file
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          recursive: true
          no-fail: 'true'
      # Pin ruff to the version locked in pyproject.toml/uv.lock — an
      # unpinned latest ruff introduces new rules and breaks CI without any
      # code change. (chartboost/ruff-action is archived; astral-sh is the
      # official successor.)
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.12"

  check-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        id: setup-uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: |
          uv run --with pyyaml ./scripts/check_versions.py

  typocheck:
    name: Spellcheck with Typos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Actions Repository
        uses: actions/checkout@v6
      - name: Check for typos
        uses: crate-ci/typos@master
        with:
          config: ./.typos.toml
